modLoader="javafml"
loaderVersion="${fmlVersionRange}"
issueTrackerURL="https://github.com/Minionade/gendustry/issues"

license="GNU GPLv3"

[[mods]]
	modId="gendustry"
	version="${version}"
	displayName="Gendustry"
	logoFile="gendustry.png"
	credits="blackdew, CrossVas, Spearkiller"
	authors="Minionade, thedarkcolour"
	description='''
	Machines for manipulation of Forestry genetics.
	'''

[[dependencies.gendustry]]
	modId="neoforge"
    type="required"
	versionRange="${neoForgeVersionRange}"
	ordering="NONE"
	side="BOTH"

[[dependencies.gendustry]]
	modId="patchouli"
    type="required"
	versionRange="${patchouliVersionRange}"
	ordering="NONE"
	side="BOTH"

[[dependencies.gendustry]]
	modId="forestry"
    type="required"
	versionRange="${forestryVersionRange}"
	ordering="NONE"
	side="BOTH"

[[dependencies.gendustry]]
	modId="jei"
    type="optional"
	versionRange="${jeiVersionRange}"
	ordering="NONE"
	side="CLIENT"
